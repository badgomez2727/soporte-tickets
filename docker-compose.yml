services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports:
      - '5432:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U app -d app']
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./api
      target: dev
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://app:app@db:5432/app?schema=public
      CORS_ORIGIN: http://localhost:5173
    ports:
      - '3000:3000'
    volumes:
      - ./api/src:/app/src
      - ./api/prisma:/app/prisma
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./web
    environment:
      VITE_API_URL: http://api:3000
    ports:
      - '5173:5173'
    volumes:
      - ./web/src:/app/src
    depends_on:
      - api

volumes:
  db-data:
