<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Identidad mínima propia: cuadrado con esquinas redondeadas en el
       marino de marca (00214F), con una T (Tickets) en el acento naranja
       (F69B12). Formas simples y bloques rectos a propósito, para que se
       lea nítido incluso a 16px en la pestaña del navegador. -->
  <rect width="32" height="32" rx="7" fill="#00214F" />
  <rect x="8" y="9" width="16" height="5" rx="1.5" fill="#F69B12" />
  <rect x="13.5" y="9" width="5" height="15" rx="1.5" fill="#F69B12" />
</svg>
